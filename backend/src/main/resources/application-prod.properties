# Perfil de produção (SPRING_PROFILES_ACTIVE=prod), atrás do proxy reverso com TLS (Caddy) no compose.yaml.
# Tudo o que muda por servidor vem de variável de ambiente, documentada no .env.example da raiz.

# Cookie da sessão sempre Secure; o proxy termina o TLS e repassa X-Forwarded-* (IP real na auditoria e no bloqueio)
app.cookie.secure=true
server.forward-headers-strategy=native
# X-Forwarded-For só é aceito vindo de IP privado (padrão do Tomcat: a rede do compose); a porta 8080 não é publicada

# Mesma origem (o proxy serve o frontend e /api): CORS só para a origem pública
app.cors.allowed-origins=${ORIGEM_PUBLICA}

# Logs em JSON (com o MDC: id de correlação), sem SQL
logging.structured.format.console=logstash
spring.jpa.show-sql=false

# Sem contrato OpenAPI
springdoc.api-docs.enabled=false

# Schema: Flyway na subida, Hibernate só valida; nada de baseline automático num banco de produção
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.jpa.hibernate.ddl-auto=validate

# Pool: os 4 jobs de importação + requisições web; 15 conexões cabem nos 100 do PostgreSQL com folga para o backup
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAXIMO:15}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

# Storage no MinIO do compose
fiscalhub.storage.tipo=s3

# Actuator na porta de gerência: só a rede interna do compose a enxerga (healthcheck); o proxy publica só a 8080
management.server.port=8081

server.shutdown=graceful
