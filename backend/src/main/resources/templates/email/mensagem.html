<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo}">Título</title>
</head>
<!-- E-mail: tabelas e estilo inline (clientes de e-mail ignoram CSS externo); nada é carregado de fora -->
<body style="margin:0;padding:0;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:24px 0;">
  <tr><td align="center">
    <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border-radius:8px;">
      <tr><td th:style="'padding:20px 28px;border-bottom:4px solid ' + ${cor} + ';'">
        <img th:if="${logo}" src="cid:logo" alt="" style="max-height:48px;max-width:200px;display:block;margin-bottom:8px;">
        <span th:text="${escritorio}" style="font-size:15px;font-weight:bold;">Escritório</span>
      </td></tr>
      <tr><td style="padding:28px;">
        <h1 th:text="${titulo}" style="font-size:20px;margin:0 0 16px;">Título</h1>
        <p th:each="p : ${paragrafos}" th:text="${p}" style="font-size:15px;line-height:1.5;margin:0 0 12px;">Parágrafo</p>
        <p style="margin:24px 0;">
          <a th:href="${link}" th:text="${botao}" th:style="'background:' + ${cor} + ';color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:6px;font-weight:bold;display:inline-block;'">Botão</a>
        </p>
        <p style="font-size:12px;color:#52606d;margin:0;">Se o botão não abrir, copie este endereço no navegador:<br>
          <span th:text="${link}" style="word-break:break-all;">link</span></p>
      </td></tr>
      <tr><td style="padding:16px 28px;font-size:12px;color:#52606d;border-top:1px solid #e4e7eb;">
        <span th:text="${escritorio}">Escritório</span> · enviado pelo FiscalHub. Não responda a este e-mail.
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
