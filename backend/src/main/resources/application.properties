# Server Configuration
server.port=8080
# Atras de proxy/load balancer use "native" ou "framework" para o IP real (X-Forwarded-For) na auditoria
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Contrato OpenAPI (/v3/api-docs) so no perfil dev
springdoc.api-docs.enabled=false

# Carrega backend/.env (formato chave=valor) se existir; variaveis de ambiente reais tem precedencia
spring.config.import=optional:file:.env[.properties]

# Database Configuration (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fiscalhub}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
# Schema gerenciado pelo Flyway (db/migration); Hibernate so valida
spring.jpa.hibernate.ddl-auto=validate
# Bancos de dev criados antes do Flyway: marca a V1 (baseline) como aplicada e segue da V2
spring.flyway.baseline-on-migrate=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration (segredo obrigatorio, minimo 256 bits = 32 bytes)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
# Cookie da sessao (JWT) com Secure; desligado no perfil dev, que roda em http
app.cookie.secure=${COOKIE_SECURE:true}

# CORS (lista separada por virgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Upload: um unico limite para o multipart (arquivo e requisicao). Acima dele: 413.
fiscalhub.upload.max-size=${UPLOAD_MAX_SIZE:500MB}
spring.servlet.multipart.max-file-size=${fiscalhub.upload.max-size}
spring.servlet.multipart.max-request-size=${fiscalhub.upload.max-size}

# Storage dos arquivos importados: local (desenvolvimento) ou s3 (S3/MinIO)
fiscalhub.storage.tipo=${STORAGE_TIPO:local}
fiscalhub.storage.local.diretorio=${STORAGE_LOCAL_DIRETORIO:./uploads/documentos}
fiscalhub.storage.s3.endpoint=${S3_ENDPOINT:}
fiscalhub.storage.s3.regiao=${S3_REGIAO:us-east-1}
fiscalhub.storage.s3.bucket=${S3_BUCKET:fiscalhub-documentos}
fiscalhub.storage.s3.access-key=${S3_ACCESS_KEY:}
fiscalhub.storage.s3.secret-key=${S3_SECRET_KEY:}

# Indices oficiais importados na subida e diariamente: SELIC (BCB/SGS serie 4390) e UPF/PR (Indicadores Economicos da SEFA-PR)
fiscalhub.indices.agendamento=${INDICES_AGENDAMENTO:true}
fiscalhub.indices.cron=0 0 6 * * *
fiscalhub.selic.inicio=2000-01
fiscalhub.upf.inicio=2025-05
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=30s

# Pool do processamento em segundo plano (jobs de documentos)
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=500
spring.task.execution.thread-name-prefix=job-

# Logging (o id de correlacao da requisicao vai no MDC: Correlacao)
logging.level.com.fiscalhub=INFO
logging.pattern.correlation=[%X{correlacao:-}] 

# Actuator: so health (com liveness e readiness); o perfil prod o move para a porta de gerencia, fora do proxy
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,armazenamento
management.endpoint.health.show-details=never

# Paginação da API em português (?pagina=0&tamanho=20), com teto por página
spring.data.web.pageable.page-parameter=pagina
spring.data.web.pageable.size-parameter=tamanho
spring.data.web.pageable.max-page-size=100

# Relatórios: limite por usuário e minuto (memória local; 429 em ProblemDetail)
fiscalhub.relatorios.emissoes-por-minuto=${RELATORIOS_EMISSOES_POR_MINUTO:10}
fiscalhub.relatorios.previas-por-minuto=${RELATORIOS_PREVIAS_POR_MINUTO:60}

# Capacidade e DFC: limite por usuário e minuto (releem arquivos do storage)
fiscalhub.capacidade.consultas-por-minuto=${CAPACIDADE_CONSULTAS_POR_MINUTO:60}

# Sessão: expira depois deste tempo sem requisição (além da expiração absoluta do token, app.jwt.expiration-ms)
fiscalhub.sessao.inatividade-minutos=${SESSAO_INATIVIDADE_MINUTOS:30}

# E-mail transacional por SMTP: Amazon SES em produção (sa-east-1, porta 587 com STARTTLS, ver docs/deploy/email-ses.md),
# Mailpit no compose de desenvolvimento. Usuário e senha SMTP só no .env. O envio é assíncrono e não afeta a saúde do backend
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORTA:1025}
spring.mail.username=${SMTP_USUARIO:}
spring.mail.password=${SMTP_SENHA:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTENTICAR:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
management.health.mail.enabled=false
fiscalhub.email.remetente=${EMAIL_REMETENTE:FiscalHub <nao-responda@localhost>}
# Novas tentativas de envio (3 no total), com espera crescente a partir deste valor
fiscalhub.email.espera-tentativa-ms=5000
# Origem dos links dos e-mails (convite, recuperação de senha)
fiscalhub.origem-publica=${ORIGEM_PUBLICA:http://localhost:5173}
# Pedidos de recuperação de senha por minuto e IP (além do limite geral de /api/auth/**)
fiscalhub.recuperacao.pedidos-por-minuto-por-ip=5

# Retenção da auditoria em anos (CTN arts. 173 e 174; prazo final a validar com o jurídico). Expurgo diário às 3h45
fiscalhub.auditoria.retencao-anos=${AUDITORIA_RETENCAO_ANOS:5}
# Reautenticação (senha e código) antes das ações destrutivas: validade do token
fiscalhub.sessao.reautenticacao-minutos=5

# Login: bloqueio progressivo depois de N falhas seguidas (conta e IP) e limite por IP nas rotas /api/auth
fiscalhub.login.falhas-por-conta=5
fiscalhub.login.falhas-por-ip=20
fiscalhub.login.requisicoes-por-minuto-por-ip=30

# Cifra de segredos guardados (segredo do TOTP): 32 bytes em Base64 (openssl rand -base64 32)
app.chave-dados=${CHAVE_DADOS}

# Quem mantém o sistema (ids de usuário, separados por vírgula; não e-mail, porque o cadastro é aberto): alertas e métricas
fiscalhub.admin-sistema=${ADMIN_SISTEMA:}

# Reavaliações de pontos de atenção sob demanda, por usuário por minuto (a automática, depois de cada importação, não conta)
fiscalhub.pontos.reavaliacoes-por-minuto=${PONTOS_REAVALIACOES_POR_MINUTO:10}
