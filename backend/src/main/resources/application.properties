# Server Configuration
server.port=8080
# Atras de proxy/load balancer use "native" ou "framework" para o IP real (X-Forwarded-For) na auditoria
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Contrato OpenAPI (/v3/api-docs) so no perfil dev
springdoc.api-docs.enabled=false

# Carrega backend/.env (formato chave=valor) se existir; variaveis de ambiente reais tem precedencia
spring.config.import=optional:file:.env[.properties]

# Database Configuration (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fiscalhub}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
# Schema gerenciado pelo Flyway (db/migration); Hibernate so valida
spring.jpa.hibernate.ddl-auto=validate
# Bancos de dev criados antes do Flyway: marca a V1 (baseline) como aplicada e segue da V2
spring.flyway.baseline-on-migrate=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration (segredo obrigatorio, minimo 256 bits = 32 bytes)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
# Cookie da sessao (JWT) com Secure; desligado no perfil dev, que roda em http
app.cookie.secure=${COOKIE_SECURE:true}

# CORS (lista separada por virgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Upload: um unico limite para o multipart (arquivo e requisicao). Acima dele: 413.
fiscalhub.upload.max-size=${UPLOAD_MAX_SIZE:500MB}
spring.servlet.multipart.max-file-size=${fiscalhub.upload.max-size}
spring.servlet.multipart.max-request-size=${fiscalhub.upload.max-size}

# Storage dos arquivos importados: local (desenvolvimento) ou s3 (S3/MinIO)
fiscalhub.storage.tipo=${STORAGE_TIPO:local}
fiscalhub.storage.local.diretorio=${STORAGE_LOCAL_DIRETORIO:./uploads/documentos}
fiscalhub.storage.s3.endpoint=${S3_ENDPOINT:}
fiscalhub.storage.s3.regiao=${S3_REGIAO:us-east-1}
fiscalhub.storage.s3.bucket=${S3_BUCKET:fiscalhub-documentos}
fiscalhub.storage.s3.access-key=${S3_ACCESS_KEY:}
fiscalhub.storage.s3.secret-key=${S3_SECRET_KEY:}

# SELIC oficial (BCB/SGS serie 4390): importada na subida e diariamente
fiscalhub.selic.agendamento=${SELIC_AGENDAMENTO:true}
fiscalhub.selic.cron=0 0 6 * * *
fiscalhub.selic.inicio=2000-01
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=30s

# Pool do processamento em segundo plano (jobs de documentos)
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=500
spring.task.execution.thread-name-prefix=job-

# Logging
logging.level.com.fiscalhub=INFO

# Paginação da API em português (?pagina=0&tamanho=20), com teto por página
spring.data.web.pageable.page-parameter=pagina
spring.data.web.pageable.size-parameter=tamanho
spring.data.web.pageable.max-page-size=100

# Relatórios: limite por usuário e minuto (memória local; 429 em ProblemDetail)
fiscalhub.relatorios.emissoes-por-minuto=${RELATORIOS_EMISSOES_POR_MINUTO:10}
fiscalhub.relatorios.previas-por-minuto=${RELATORIOS_PREVIAS_POR_MINUTO:60}
