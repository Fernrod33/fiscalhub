# Server Configuration
server.port=8080

# Carrega backend/.env (formato chave=valor) se existir; variaveis de ambiente reais tem precedencia
spring.config.import=optional:file:.env[.properties]

# Database Configuration (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fiscalhub}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
# Schema gerenciado pelo Flyway (db/migration); Hibernate so valida
spring.jpa.hibernate.ddl-auto=validate
# Bancos de dev criados antes do Flyway: marca a V1 (baseline) como aplicada e segue da V2
spring.flyway.baseline-on-migrate=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration (segredo obrigatorio, minimo 256 bits = 32 bytes)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# CORS (lista separada por virgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Upload Configuration
fiscalhub.upload.directory=./uploads/documentos
fiscalhub.upload.max-size-bytes=5242880

# Logging
logging.level.com.fiscalhub=INFO
