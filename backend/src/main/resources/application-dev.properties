# Perfil de desenvolvimento: SPRING_PROFILES_ACTIVE=dev
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.com.fiscalhub=DEBUG
logging.level.org.springframework.security=DEBUG

# Seed de desenvolvimento (UFPR aproximada) junto com as migracoes
spring.flyway.locations=classpath:db/migration,classpath:db/dev

# Contrato OpenAPI para gerar os tipos do frontend (npm run gerar:api)
springdoc.api-docs.enabled=true
