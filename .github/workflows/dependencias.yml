# OWASP Dependency-Check do backend: semanal, em push para main/v2 e manual. Quebra só com CVSS >= 7 (alta e crítica).
# Precisa do secret NVD_API_KEY (chave gratuita em https://nvd.nist.gov/developers/request-an-api-key): sem ela o
# download da base do NVD leva horas. Fora do CI de PR porque a base é grande; o relatório fica como artefato.
name: Dependências

on:
  push:
    branches: [main, v2]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owasp:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-
      - run: >
          mvn -B -ntp org.owasp:dependency-check-maven:12.1.8:check
          -DfailBuildOnCVSS=7 -DnvdApiKey=${{ secrets.NVD_API_KEY }}
          -DskipTestScope=true -DassemblyAnalyzerEnabled=false -Dformats=HTML,JSON
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check
          path: backend/target/dependency-check-report.*
          retention-days: 30
