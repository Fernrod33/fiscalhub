# Desenvolvimento e e2e do CI: o mesmo compose.yaml, sem TLS, em http://localhost.
#   docker compose -f compose.yaml -f compose.dev.yaml up -d --build      (ou .\iniciar.ps1 -Docker)
# O backend roda no perfil dev (cookie sem Secure, seed de desenvolvimento) e publica a 8080 para o Vite (npm run dev).
services:
  # com o seed de desenvolvimento (db/dev), como o perfil dev faz fora do Docker
  migracao:
    environment:
      FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/dev
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_FLYWAY_ENABLED: "false" # quem migra é o serviço migracao
      STORAGE_TIPO: s3
      ORIGEM_PUBLICA: http://localhost
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      # e-mails ficam no Mailpit (http://localhost:8025), nada sai para fora
      SMTP_HOST: mailpit
      EMAIL_REMETENTE: FiscalHub <nao-responda@localhost>
    ports:
      - "127.0.0.1:8080:8080"
  mailpit:
    image: axllent/mailpit:v1.27.11
    ports:
      - "127.0.0.1:8025:8025"
  proxy:
    environment:
      DOMINIO: http://localhost
    ports: !override
      - "127.0.0.1:80:80"
